[project]
name = "docpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex Choux", email = "choux.alex@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
docpilot = "docpilot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
